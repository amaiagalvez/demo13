name: tests

# The application lives in its own repository. demo13 consumes the four domain packages as
# Composer `path` repositories under ../../packages/*, so every job checks them out as siblings
# in the same layout used locally; that keeps the lock file and the symlinks valid.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect non-doc changes
        id: filter
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$GITHUB_SHA" | grep -Ev '\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/demo13
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_phpunit
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      MARIADB_ROOT_PASSWORD: tormenta

    services:
      db:
        image: mariadb:11.7
        env:
          MARIADB_ROOT_PASSWORD: tormenta
          MARIADB_DATABASE: laravel
          MARIADB_USER: laravel
          MARIADB_PASSWORD: laravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: projects/demo13

      # Sibling packages are checked out on the branch that triggered this run when they have it
      # (a push to develop tests develop against develop), and on their default branch otherwise.
      - name: Pick the packages' branch
        id: siblings
        working-directory: .
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in basics13 entities13 projects13 entity-projects13; do
            if git ls-remote --exit-code --heads "https://github.com/amaiagalvez/$repo.git" "$BRANCH" > /dev/null 2>&1; then
              echo "$repo=$BRANCH" >> "$GITHUB_OUTPUT"
            else
              echo "$repo=" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Checkout domain packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: amaiagalvez/basics13
          ref: ${{ steps.siblings.outputs['basics13'] }}
          path: packages/basics13

      - name: Checkout domain packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: amaiagalvez/entities13
          ref: ${{ steps.siblings.outputs['entities13'] }}
          path: packages/entities13

      - name: Checkout domain packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: amaiagalvez/projects13
          ref: ${{ steps.siblings.outputs['projects13'] }}
          path: packages/projects13

      - name: Checkout domain packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: amaiagalvez/entity-projects13
          ref: ${{ steps.siblings.outputs['entity-projects13'] }}
          path: packages/entity-projects13

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('projects/demo13/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/demo13/package-lock.json

      # composer setup migrates, so this step alone targets the application schema.
      - name: Setup Application
        env:
          DB_DATABASE: laravel
        run: composer setup

      - name: Audit dependencies
        run: composer audit --no-interaction --abort-on-unfixable

      # @vite renders on every page, so the manifest has to exist before the PHP suite runs.
      - name: Install node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create PHPUnit database
        run: >-
          mysql -h 127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD" -e
          "CREATE DATABASE IF NOT EXISTS laravel_phpunit CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          GRANT ALL PRIVILEGES ON laravel_phpunit.* TO 'laravel'@'%';"

      - name: Run CI Checks
        env:
          XDEBUG_MODE: coverage
        run: composer ci:check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: projects/demo13/storage/logs/coverage.xml
          if-no-files-found: warn
          retention-days: 7

  dusk:
    needs: [changes, ci]
    if: ${{ always() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/demo13
    env:
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_dusk
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      DUSK_BASE_URL: http://127.0.0.1:8000
      DUSK_CHROME_BINARY: /usr/bin/google-chrome
      MARIADB_ROOT_PASSWORD: tormenta

    services:
      db:
        image: mariadb:11.7
        env:
          MARIADB_ROOT_PASSWORD: tormenta
          MARIADB_DATABASE: laravel
          MARIADB_USER: laravel
          MARIADB_PASSWORD: laravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: projects/demo13

      # Sibling packages are checked out on the branch that triggered this run when they have it
      # (a push to develop tests develop against develop), and on their default branch otherwise.
      - name: Pick the packages' branch
        id: siblings
        working-directory: .
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in basics13 entities13 projects13 entity-projects13; do
            if git ls-remote --exit-code --heads "https://github.com/amaiagalvez/$repo.git" "$BRANCH" > /dev/null 2>&1; then
              echo "$repo=$BRANCH" >> "$GITHUB_OUTPUT"
            else
              echo "$repo=" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Checkout domain packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: amaiagalvez/basics13
          ref: ${{ steps.siblings.outputs['basics13'] }}
          path: packages/basics13

      - name: Checkout domain packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: amaiagalvez/entities13
          ref: ${{ steps.siblings.outputs['entities13'] }}
          path: packages/entities13

      - name: Checkout domain packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: amaiagalvez/projects13
          ref: ${{ steps.siblings.outputs['projects13'] }}
          path: packages/projects13

      - name: Checkout domain packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: amaiagalvez/entity-projects13
          ref: ${{ steps.siblings.outputs['entity-projects13'] }}
          path: packages/entity-projects13

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('projects/demo13/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/demo13/package-lock.json

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Create Dusk database
        run: >-
          mysql -h 127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD" -e
          "CREATE DATABASE IF NOT EXISTS laravel_dusk CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          GRANT ALL PRIVILEGES ON laravel_dusk.* TO 'laravel'@'%';"

      - name: Prepare ChromeDriver
        run: php artisan dusk:chrome-driver --detect

      - name: Start application
        run: php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/up > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/laravel.log
          exit 1

      # phpunit.dusk.xml also collects the browser suites shipped by entities13 and
      # entity-projects13 through vendor/amaia/*/tests/Browser, so this covers them too.
      - name: Run Dusk
        run: php artisan dusk

      - name: Upload Dusk failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dusk-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            projects/demo13/tests/Browser/screenshots/
            projects/demo13/tests/Browser/console/
            /tmp/laravel.log
          if-no-files-found: warn
          retention-days: 7